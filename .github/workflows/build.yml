name: Build EyePair App

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:     # erlaubt manuelles Starten ueber GitHub-UI

jobs:
  # ============ Android APK Build ============
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'

      - name: Init plattform-spezifische Templates
        # --org at.sbp + project-name eye_pair_app_oled => applicationId "at.sbp.eye_pair_app_oled".
        # EIGENER applicationId (nicht at.sbp.eye_pair_app), damit die OLED-App PARALLEL zur
        # anderen App (eye_pair_app_new_screens_cheaper) auf dem Handy installiert bleiben kann.
        run: flutter create . --platforms=android,ios --org at.sbp --project-name=eye_pair_app_oled

      - name: Install deps
        run: flutter pub get

      - name: Apply Android permissions + minSdk
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # xmlns:tools im manifest-Tag
          sed -i 's|<manifest |<manifest xmlns:tools="http://schemas.android.com/tools" |' $MANIFEST
          # BLE + INTERNET Permissions vor <application> einfuegen
          # (INTERNET noetig fuer Cloud-Eyes Download von GitHub-API in Release-Builds)
          sed -i '/<application/i \
              <uses-permission android:name="android.permission.INTERNET" />\
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" tools:targetApi="s" />\
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />\
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />' $MANIFEST
          # minSdkVersion 21 (sowohl Groovy- als auch Kotlin-DSL Versionen abdecken)
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' android/app/build.gradle.kts 2>/dev/null || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle 2>/dev/null || true
          echo "=== Manifest ==="
          cat $MANIFEST

      - name: Set Android app label
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # robust: beliebigen android:label-Wert (Default = Projektname) durch den Anzeigenamen ersetzen
          sed -i 's|android:label="[^"]*"|android:label="SBP Eye App OLED"|' $MANIFEST
          grep 'android:label' $MANIFEST

      - name: Setup Release-Signatur (fester Keystore -> Updates ohne Neuinstallation)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "Kein Keystore-Secret -> Debug-Signatur (Fallback)"; exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.p12
          python3 ci/patch_signing.py
          echo "=== signingConfig ==="; grep -nE "signingConfig|storeFile|keyAlias" android/app/build.gradle.kts || true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: eye_pair_app-android-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Release bei git-tag (z.B. v1.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk

  # ============ iOS IPA Build (optional) ============
  # Laeuft nur bei manuellem Start oder Tag-Push - macOS-Runner sind teurer in CI-Minuten
  ios:
    name: Build iOS IPA (unsigned)
    runs-on: macos-14
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'

      - name: Init Templates
        # --org at.sbp + project-name eye_pair_app_oled => applicationId "at.sbp.eye_pair_app_oled".
        # EIGENER applicationId (nicht at.sbp.eye_pair_app), damit die OLED-App PARALLEL zur
        # anderen App (eye_pair_app_new_screens_cheaper) auf dem Handy installiert bleiben kann.
        run: flutter create . --platforms=android,ios --org at.sbp --project-name=eye_pair_app_oled

      - name: Install deps
        run: flutter pub get

      - name: Add iOS Bluetooth-Permission Keys
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string 'EyePair benoetigt Bluetooth fuer die Augen-Steuerung.'" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothPeripheralUsageDescription string 'EyePair benoetigt Bluetooth fuer die Augen-Steuerung.'" ios/Runner/Info.plist || true

      - name: Set iOS display name
        run: |
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'SBP Eye App OLED'" $PLIST || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'SBP Eye App OLED'" $PLIST
          /usr/libexec/PlistBuddy -c "Set :CFBundleName 'SBP Eye App OLED'" $PLIST || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" $PLIST

      - name: Build iOS unsigned
        run: flutter build ios --release --no-codesign

      - name: Package .ipa Payload
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -qr eye_pair_app-unsigned.ipa Payload
          ls -la

      - name: Upload IPA als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: eye_pair_app-ios-unsigned
          path: build/ios/iphoneos/eye_pair_app-unsigned.ipa
